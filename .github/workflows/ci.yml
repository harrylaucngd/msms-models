name: Core checks
on: [push, pull_request]
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
jobs:
  # The locked versions of environments/linux-cuda.txt, as the paper rows use them.
  locked:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: bash environments/install.sh
      - run: uv pip install --python .venv/bin/python pytest ruff
      - run: .venv/bin/ruff check src tests
      - run: .venv/bin/python -m pytest
      # The locks must match pyproject.toml.
      - run: bash environments/lock.sh && git diff --exit-code environments/
  # Current releases, so that new versions of dependencies break CI before users.
  latest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test,mces]'
      - run: python -m pytest
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: python -I -m msms_models.cli models
