# Table 3, row (2) corrected: GLMR trained and evaluated on RDKit-canonical SMILES.
# Candidates: the official MassSpecGym 1.5 formula pool keyed by spectrum ID
# (built by paper/prepare_data.sh; identical to GLMR's SpecBridge_MSGYM_candidates_ca.pkl
# on every test spectrum). Weights: GLMR run `outputs_new`.
# Paths are relative to this file.
model: chemformer-two-stage
dataset: msg
queries: ../../../data/msg/queries.jsonl
output: ../../../results/paper/table3/chemformer_two_stage_corrected
# The original ran on an H200 under CUDA fp16 autocast; CPU runs in fp32 and is slow.
device: cuda
workers: 1
seed: 42
assets:
  chemformer_checkpoint: ../../../checkpoints/chemformer/step=1000000.ckpt
  pre_retrieval_checkpoint: ../../../checkpoints/chemformer_two_stage/corrected/pre_retrieval.pt
  generative_checkpoint: ../../../checkpoints/chemformer_two_stage/corrected/generative.pt
  candidates: ../../../data/msg/candidates_formula_1.5.jsonl
parameters:
  max_peaks: 61
  pre_retrieval_k: 40
  beam_size: 5
  max_gen_len: 512
  eval_batch_size: 32
  candidate_batch_size: 512
