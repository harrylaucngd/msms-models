# Table 3, (1) DreaMS + ChemBERTa alignment (SpecBridge), inflated. Paths are relative to this file.
# Raw MassSpecGym strings: the true SMILES keeps its PubChem (Kekule) spelling while the
# decoys are RDKit-canonical; ChemBERTa was further MLM-trained on canonical SMILES
# (MassSpecGym test InChIKey-14s excluded). Diagnostic row.
model: dreams-chemberta
dataset: msg
queries: ../../../data/msg/queries.jsonl
output: ../../../results/paper/table3/dreams_chemberta_inflated
device: cpu
workers: 1
seed: 1234
assets:
  checkpoint: ../../../checkpoints/dreams_chemberta/inflated.pt
  # SpecBridge's evaluation order (see candidates.py): random.shuffle seeded 1234 over all pool keys.
  candidates: ../../../data/paper/table3/dreams_chemberta/candidates_inflated.jsonl
parameters:
  chemberta_model: Derify/ChemBERTa_augmented_pubchem_13m
  chemberta_revision: 2da3150903b33f2a9f65aa06c867e5d32256adb5
  # Spectra per DreaMS batch. Padded peaks act as attention keys, so embeddings depend on it.
  batch_size: 32
  embedding_batch_size: 512
