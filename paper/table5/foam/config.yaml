# Table 5, FOAM (DiffMS + PubChem). Paths are relative to this file.
model: foam
dataset: msg
queries: ../../../data/msg/queries.jsonl
output: ../../../results/paper/table5/foam
device: cpu
workers: 1
seed: 42
assets:
  generator_checkpoint: ../../../checkpoints/iceberg/msg_generator.ckpt
  intensity_checkpoint: ../../../checkpoints/iceberg/msg_intensity.ckpt
  seeds: ../../../data/paper/table5/foam/seeds.jsonl
parameters:
  max_calls: 1500
  population_size: 200
  offspring_size: 600
  starting_seed_size: -1
  num_islands: 1
  mutation_rate: 0.2
  num_bins: 15000
  ignore_precursor_peak: true
