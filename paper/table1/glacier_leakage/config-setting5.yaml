# Table 1, setting 5: MIST without augmentation. Paths are relative to this file.
model: mist
dataset: msg
queries: ../../../data/msg/queries.jsonl
output: ../../../results/paper/table1/setting5
device: cpu
workers: 1
seed: 42
assets:
  candidates: ../../../data/msg/candidates_formula.jsonl
  posterior: ../../../data/paper/posteriors/mist_noaug_table1/probabilities.npy
  posterior_ids: ../../../data/paper/posteriors/mist_noaug_table1/query_ids.npy
parameters:
  fingerprint_representation: binary
  # Calibrated on validation: total predicted on-bits match the reference count.
  fingerprint_threshold: 0.10577025637030602
  candidate_ties: legacy-quicksort
