# Table 1, setting 3: GLACIER trained on train, augmenting MSG-4M + MSG test. Paths are relative to this file.
model: mist
dataset: msg
queries: ../../../data/msg/queries.jsonl
output: ../../../results/paper/table1/setting3
device: cpu
workers: 1
seed: 42
assets:
  candidates: ../../../data/msg/candidates_formula.jsonl
  posterior: ../../../data/paper/posteriors/mist_table1_setting3/probabilities.npy
  posterior_ids: ../../../data/paper/posteriors/mist_table1_setting3/query_ids.npy
parameters:
  fingerprint_representation: binary
  # Calibrated on validation: total predicted on-bits match the reference count.
  fingerprint_threshold: 0.19319674372673035
  candidate_ties: legacy-quicksort
