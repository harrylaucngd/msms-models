[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msms-models"
version = "0.2.0"
description = "Reproducible molecular generation and retrieval from tandem mass spectra"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND Apache-2.0 AND CC-BY-NC-SA-4.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "LICENSES/*.txt", "src/msms_models/_vendor/**/LICENSE.txt"]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=1.5", "PyYAML>=6", "rdkit>=2023.9"]

[project.optional-dependencies]
mces = ["myopic-mces==1.0.1", "pulp>=2.9"]
nn = ["numpy==1.24.4", "scipy==1.10.1", "rdkit==2023.9.4"]
mist = ["mist @ git+https://github.com/coleygroup/MIST@4d09208fceaa9a34579493a70095416405b76563"]
molforge = ["torch>=2.7", "sentencepiece>=0.2"]
ms-gpt-base = ["torch>=2.7", "transformers==4.52.4", "safe-mol==0.1.13"]
ms-gpt = ["torch>=2.7", "transformers==4.52.4", "safe-mol==0.1.13", "peft==0.19.1", "safetensors>=0.7"]
frigid = ["torch>=2.7", "transformers==4.52.4", "lightning==2.5.1", "hydra-core>=1.3", "bionemo-moco==0.0.2.1", "safe-mol==0.1.13", "ngboost==0.5.8", "joblib==1.5.2", "scikit-learn==1.7.2"]
iceberg = ["torch>=2.7", "dgl==1.1.3", "torch-scatter==2.1.2", "pytorch-lightning==1.9.5", "setuptools>=77,<81", "pygmtools", "h5py", "platformdirs", "pathos", "requests", "tqdm"]
foam = ["torch>=2.7", "pymoo==0.6.1.5", "wandb>=0.13"]
test = ["pytest>=8", "ruff>=0.17", "build"]

[project.scripts]
msms-models = "msms_models.cli:main"

[project.urls]
Repository = "https://github.com/harrylaucngd/msms-models"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
msms_models = ["*.json", "_vendor/**/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["src/msms_models/_vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
