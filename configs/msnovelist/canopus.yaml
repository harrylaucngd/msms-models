# MIST + MSNovelist on CANOPUS (NPLIB1). Paths are relative to this file.
# Encoder: the DiffMS-era MIST for CANOPUS (Bohde's canopus_fp_mist_4096, split
# canopus_hplus_100_0); its posteriors for the 818 test spectra, computed at batch size 128
# for the original baseline. The decoder rounds them at 0.5. See the model guide.
model: msnovelist
dataset: canopus
queries: ../../data/canopus/queries.jsonl
output: ../../results/msnovelist/canopus
device: cpu
workers: 1
seed: 42
assets:
  decoder_checkpoint: ../../checkpoints/msnovelist/w-12-0.034-0.019.pth
  posterior: ../../data/posteriors/mist_diffms_canopus/probabilities.npy
  posterior_ids: ../../data/posteriors/mist_diffms_canopus/query_ids.npy
parameters:
  beam_size: 100
  top_k: 10
  batch_size: 32
