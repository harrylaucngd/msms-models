# MIST + MSNovelist, the baseline cited in Table 5. Paths are relative to this file.
# Encoder: the DiffMS-era MIST (Bohde's msg_magma_best.ckpt, epoch 195); these are its
# posteriors for the 17,556 MassSpecGym test spectra, computed at batch size 128 in January
# 2025 for the original baseline. The decoder rounds them at 0.5. See the model guide.
model: msnovelist
dataset: msg
queries: ../../data/msg/queries.jsonl
output: ../../results/msnovelist/msg
device: cpu
workers: 1
seed: 42
assets:
  decoder_checkpoint: ../../checkpoints/msnovelist/w-12-0.034-0.019.pth
  posterior: ../../data/posteriors/mist_diffms_msg/probabilities.npy
  posterior_ids: ../../data/posteriors/mist_diffms_msg/query_ids.npy
parameters:
  beam_size: 100
  top_k: 10
  batch_size: 32
