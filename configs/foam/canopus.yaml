# Paths are relative to this file. Download weights from the linked provider.
model: foam
dataset: canopus
queries: ../../data/canopus/queries.jsonl
output: ../../results/foam/canopus
device: cpu
workers: 1
seed: 42
assets:
  generator_checkpoint: ../../checkpoints/iceberg/canopus_generator.ckpt
  intensity_checkpoint: ../../checkpoints/iceberg/canopus_intensity.ckpt
  seeds: ../../data/canopus/foam_seeds.jsonl
parameters:
  max_calls: 1500
  population_size: 200
  offspring_size: 600
  starting_seed_size: -1
  num_islands: 1
  mutation_rate: 0.2
  num_bins: 15000
  ignore_precursor_peak: true
