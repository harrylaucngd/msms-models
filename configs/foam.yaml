# Paths are relative to this file. Replace asset locations with your downloaded files.
model: foam
dataset: msg
queries: ../data/queries.jsonl
output: ../results/foam
device: cpu
workers: 1
seed: 42
assets:
  generator_checkpoint: ../artifacts/iceberg/msg_generator.ckpt
  intensity_checkpoint: ../artifacts/iceberg/msg_intensity.ckpt
  seeds: ../data/foam_seeds.jsonl
  seed_manifest: ../data/foam_seed_manifest.json
parameters:
  query_intensity_space: native
  max_calls: 1500
  population_size: 200
  offspring_size: 600
  starting_seed_size: -1
  num_islands: 1
  mutation_rate: 0.2
  num_bins: 15000
  ignore_precursor_peak: true
