# Paths are relative to this file. Download weights from the linked provider.
model: ms-gpt-base
dataset: canopus
queries: ../../data/canopus/queries.jsonl
output: ../../results/ms-gpt-base/canopus
device: cpu
workers: 1
seed: 42
assets:
  mist_checkpoint: ../../checkpoints/mist_canopus_noaug.ckpt
  compact_cache: ../../data/compact/canopus/test
  decoder_checkpoint: ../../checkpoints/ms-gpt/decoder.pt
  decoder_config: architecture.yaml
  calibration: ../../data/calibration/ms-gpt/canopus.json
  decoder_tokenizer: ../../checkpoints/ms-gpt/tokenizer.json
parameters:
  num_queries: 20
  samples_per_query: 5
  temperature: 1.0
  top_k: 50
  top_p: 0.95
