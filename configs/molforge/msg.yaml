# Paths are relative to this file. Download weights from the linked provider.
# 0.5 is an example; use the threshold calibrated for your encoder.
model: molforge
dataset: msg
queries: ../../data/msg/queries.jsonl
output: ../../results/molforge/msg
device: cpu
workers: 1
seed: 42
assets:
  mist_checkpoint: ../../checkpoints/mist_msg_noaug.ckpt
  compact_cache: ../../data/compact/msg/test
  decoder_checkpoint: ../../checkpoints/molforge/decoder.pth
  source_tokenizer: ../../checkpoints/molforge/source.model
  target_tokenizer: ../../checkpoints/molforge/target.model
parameters:
  fingerprint_threshold: 0.5
  beam_size: 10
  formula_filter: false
