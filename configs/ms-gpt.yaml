# Paths are relative to this file. Replace asset locations with your downloaded files.
model: ms-gpt
dataset: msg
queries: ../data/queries.jsonl
output: ../results/ms-gpt
device: cpu
workers: 1
seed: 42
assets:
  mist_checkpoint: ../artifacts/mist/msg_noaug.ckpt
  compact_cache: ../data/compact/msg/test
  decoder_checkpoint: ../artifacts/ms_gpt/decoder.pt
  decoder_config: ../artifacts/ms_gpt/model.yaml
  calibration: ../artifacts/ms_gpt/msg_density_band.json
parameters:
  num_queries: 20
  samples_per_query: 5
  temperature: 1.0
  top_k: 50
  top_p: 0.95
