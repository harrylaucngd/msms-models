# Paths are relative to this file. These settings bind the corrected MSG encoder.
# Obtain the exact assets listed below; alternate encoders need their own calibration.
model: frigid-base
dataset: msg
queries: ../../data/msg/queries.jsonl
output: ../../results/frigid-base/msg
device: cpu
workers: 1
seed: 42
assets:
  mist_checkpoint: ../../checkpoints/mist_msg_aug.ckpt
  compact_cache: ../../data/compact/msg/test
  decoder_checkpoint: ../../checkpoints/frigid/decoder.ckpt
  safe_tokenizer: ../../checkpoints/frigid/tokenizer.json
  length_model: ../../checkpoints/frigid/msg_length.joblib
  length_features: ../../checkpoints/frigid/msg_length_features.json
parameters:
  fingerprint_threshold: 0.18791014701128006
  num_samples: 128
  temperature: 1.0
  randomness: 10.0
asset_sha256:
