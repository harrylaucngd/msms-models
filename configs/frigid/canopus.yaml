# Paths are relative to this file. The weights come from the upstream projects (docs/assets.md).
# Calibrated for the CANOPUS augmented EMA encoder below.
model: frigid
dataset: canopus
queries: ../../data/canopus/queries.jsonl
output: ../../results/frigid/canopus
device: cpu
workers: 1
seed: 42
assets:
  mist_checkpoint: ../../checkpoints/mist_canopus_aug.ckpt
  compact_cache: ../../data/compact/canopus/test
  decoder_checkpoint: ../../checkpoints/frigid/decoder.ckpt
  safe_tokenizer: ../../checkpoints/frigid/tokenizer.json
  length_model: ../../checkpoints/frigid/canopus_length.joblib
  length_features: ../../checkpoints/frigid/canopus_length_features.json
  generator_checkpoint: ../../checkpoints/iceberg/canopus_generator.ckpt
  intensity_checkpoint: ../../checkpoints/iceberg/canopus_intensity.ckpt
parameters:
  fingerprint_threshold: 0.20425235480070114
  batch_size: 128
  num_rounds: 25  # initial generation + 24 refinement transitions
  num_unique_to_refine: 8
  masks_per_molecule: 12
  mask_probability: 0.75
