# Paths are relative to this file. These settings bind the corrected MSG encoder.
# Obtain the exact assets listed below; alternate encoders need their own calibration.
model: frigid
dataset: msg
queries: ../../data/msg/queries.jsonl
output: ../../results/frigid/msg
device: cpu
workers: 1
seed: 42
assets:
  mist_checkpoint: ../../checkpoints/mist_msg_aug.ckpt
  compact_cache: ../../data/compact/msg/test
  decoder_checkpoint: ../../checkpoints/frigid/decoder.ckpt
  safe_tokenizer: ../../checkpoints/frigid/tokenizer.json
  length_model: ../../checkpoints/frigid/msg_length.joblib
  length_features: ../../checkpoints/frigid/msg_length_features.json
  generator_checkpoint: ../../checkpoints/iceberg/msg_generator.ckpt
  intensity_checkpoint: ../../checkpoints/iceberg/msg_intensity.ckpt
parameters:
  fingerprint_threshold: 0.18791014701128006
  query_intensity_space: native
  batch_size: 128
  num_rounds: 11  # initial generation + ten refinement transitions
  num_unique_to_refine: 8
  masks_per_molecule: 12
  mask_probability: 0.75
asset_sha256:
  # EMA release repackaged from source checkpoint 548c1301...659b6.
  mist_checkpoint: 9f251d772f68315ba6fe2dc75a3b2e1ec477d3f41ffbeaf5143749157b67b177
  decoder_checkpoint: b6177c2d43448380aba80ff41c01461ea34ca2ca93b213986954c5afb7f0f457
